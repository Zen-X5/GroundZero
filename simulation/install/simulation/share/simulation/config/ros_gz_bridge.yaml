# ROS 2 <-> Gazebo Harmonic Topic Bridge Configuration

# Drone 1 (Sector A - Flood Area)
- ros_topic_name: "/drone_1/cmd_vel"
  gz_topic_name: "/drone_1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/drone_1/odometry"
  gz_topic_name: "/drone_1/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/drone_1/camera/image_raw"
  gz_topic_name: "/drone_1/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/drone_1/imu"
  gz_topic_name: "/drone_1/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

